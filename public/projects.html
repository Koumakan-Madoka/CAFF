<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>CAFF Project Manager</title>
    <link rel="stylesheet" href="/styles.css" />
    <script defer src="/shared/api-client.js"></script>
    <script defer src="/shared/toast.js"></script>
    <script defer src="/shared/management-list.js"></script>
    <script defer src="/projects.js"></script>
  </head>
  <body class="management-app" data-page="projects">
    <div class="management-shell">
      <nav class="rail" aria-label="主导航">
        <a class="rail-link" href="/" title="聊天工作台" aria-label="聊天工作台">💬</a>
        <a class="rail-link" href="/personas.html" title="人格管理" aria-label="人格管理">🎭</a>
        <a class="rail-link" href="/skills.html" title="Skill 管理" aria-label="Skill 管理">🛠️</a>
        <a class="rail-link" aria-current="page" href="/projects.html" title="项目管理" aria-label="项目管理">📁</a>
        <a class="rail-link" href="/metrics.html" title="评测报表" aria-label="评测报表">📊</a>
      </nav>

      <div class="management-main">
        <header class="management-header">
          <div class="management-title">
          <p class="eyebrow">CAFF Project Manager</p>
          <h1>项目管理</h1>
          <p class="subtitle">管理当前 CAFF 实例的项目列表，并选择激活的工作目录（影响 Trellis 上下文与外部技能目录）。</p>
          </div>
          <button id="refresh-button" class="management-icon-button" type="button" title="刷新" aria-label="刷新">⟳</button>
        </header>

        <main class="management-content">
        <aside class="management-pane management-index">
          <div class="panel-header">
            <div>
              <p class="eyebrow">Projects</p>
              <h2>项目列表</h2>
            </div>
          </div>
          <ul id="project-list" class="agent-list" aria-label="项目列表"></ul>
        </aside>

        <section class="management-pane management-detail">
          <div class="panel-header">
            <div>
              <p class="eyebrow">Editor</p>
              <h2 id="editor-title">项目详情</h2>
            </div>
          </div>

          <div class="stack-card">
            <form id="new-project-form" class="settings-form compact-settings-form">
              <label>
                <span>项目名称（可选）</span>
                <input id="project-name" name="name" type="text" maxlength="80" placeholder="例如：my-repo" />
              </label>

              <label>
                <span>项目路径</span>
                <input id="project-path" name="path" type="text" maxlength="400" placeholder="例如：E:\\repo\\my-project" />
              </label>

              <div class="button-row">
                <button id="create-project-button" type="submit">添加并激活</button>
              </div>
            </form>
          </div>

          <div class="stack-card">
            <div class="panel-header">
              <div>
                <p class="eyebrow">Selected</p>
                <h3 id="selected-project-title">未选择项目</h3>
                <p id="selected-project-meta" class="muted">从左侧选择一个项目</p>
              </div>
            </div>

            <div class="button-row">
              <button id="set-active-button" type="button">设为激活</button>
              <button id="delete-project-button" class="ghost-button danger" type="button">删除项目</button>
            </div>
          </div>
        </section>
        </main>
      </div>
    </div>

    <div id="toast" class="toast hidden"></div>
  </body>
</html>
