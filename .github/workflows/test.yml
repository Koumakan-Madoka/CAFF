name: test
on:
  push:
  pull_request:
jobs:
  unit:
    runs-on: ubuntu-latest
    env:
      CAFF_REQUIRE_SPAWN: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.19.0
          cache: npm
      - run: npm ci
      - name: Select runner Chrome for browser fixtures
        run: |
          browser="$(command -v google-chrome)"
          echo "CAFF_UI_BROWSER_PATH=$browser" >> "$GITHUB_ENV"
      - run: npm test
