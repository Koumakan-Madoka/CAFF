name: test
on:
  push:
  pull_request:
jobs:
  unit:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    env:
      CAFF_REQUIRE_SPAWN: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.19.0
          cache: npm
      - name: Native PTY build prerequisites
        if: runner.os == 'Linux'
        run: python3 --version && g++ --version && make --version
      - run: npm ci --foreground-scripts
      - name: Require native PTY artifacts (Linux compiled module / Windows bundled ConPTY)
        run: node scripts/check-planner-pty.js
      - name: Select runner Chrome for browser fixtures
        if: runner.os == 'Linux'
        run: |
          browser="$(command -v google-chrome)"
          echo "CAFF_UI_BROWSER_PATH=$browser" >> "$GITHUB_ENV"
      - run: npm run typecheck
      - run: npm test
      - run: npm run test:dag-execution
      - run: git diff --check
